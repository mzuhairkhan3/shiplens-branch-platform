version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shiplens
      POSTGRES_USER: shiplens
      POSTGRES_PASSWORD: shiplens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: shiplens
      POSTGRES_USER: shiplens
      POSTGRES_PASSWORD: shiplens

volumes:
  postgres_data:
