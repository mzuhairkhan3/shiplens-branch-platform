name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shiplens_test
          POSTGRES_USER: shiplens
          POSTGRES_PASSWORD: shiplens
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checks
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: shiplens_test
          POSTGRES_USER: shiplens
          POSTGRES_PASSWORD: shiplens
          SECRET_KEY: ci-secret-key-for-testing
          DEBUG: "True"
        run: |
          python manage.py check
          # python manage.py test   # will enable when we have tests
